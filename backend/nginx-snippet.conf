# ============================================================
# Nginx 反向代理片段 —— 把 /api/ 开头的请求转交给本机 3000 端口的 Node 服务
# ------------------------------------------------------------
# 用法：把下面这段放进 /etc/nginx/sites-available/default 的 server { } 里
#（和现有的 location / 平级），然后：
#   sudo nginx -t                  # 先测配置有没有写错
#   sudo systemctl reload nginx
#
# 原理：浏览器只跟 Nginx 的 80 端口说话。
#   请求 /        → Nginx 直接回 /var/www/shichanglianer 里的静态文件（现状不变）
#   请求 /api/... → Nginx 转手交给 Node（同源，浏览器不会拦跨域）
# ============================================================

location /api/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 30s;
}
